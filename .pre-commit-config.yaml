# Git hooks managed by prek (Rust drop-in for pre-commit).
# Install once:  uv run prek install
# Run all:       uv run prek run --all-files
# Docs:          https://prek.j178.dev
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        description: "Lint — must be 0 errors. Config in pyproject.toml [tool.ruff]."
        entry: uv run ruff check
        language: system
        types: ["python"]
        pass_filenames: false
        require_serial: true
      - id: ruff-format
        name: ruff format --check
        description: "Verify formatting. Fix with: uv run ruff format"
        entry: uv run ruff format --check
        language: system
        types: ["python"]
        pass_filenames: false
        require_serial: true
      - id: ty-check
        name: ty check
        description: "Type-check — must be 0 errors. Config in pyproject.toml [tool.ty.src]."
        entry: uv run ty check
        language: system
        types: ["python"]
        pass_filenames: false
        require_serial: true
