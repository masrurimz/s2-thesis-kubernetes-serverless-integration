[project]
name = "cli"
version = "0.1.0"
description = "Unified CLI entry point for thesis system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared",
    "typer>=0.15.0",
    "rich>=13.0.0",
]

[project.scripts]
thesis = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]
