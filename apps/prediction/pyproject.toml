[project]
name = "prediction"
version = "0.1.0"
description = "GRU workload prediction service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "numpy",
    "pandas>=2.3.1",
    "scikit-learn>=1.7.1",
    "joblib",
    "structlog",
    "typer>=0.15.0",
]

[project.scripts]
thesis-prediction-server = "prediction.server:cli_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prediction"]
