[project]
name = "thesis-scripts"
version = "0.1.0"
description = "Analysis and experiment scripts for thesis"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "infra",
    "prediction",
    "routing",
    "numpy",
    "scipy",
    "requests",
    "structlog",
    "rich",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
