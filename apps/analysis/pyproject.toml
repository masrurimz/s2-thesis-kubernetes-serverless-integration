[project]
name = "analysis-cli"
version = "0.1.0"
description = "Typer CLI for thesis experiment analysis (reanalysis, robust stats, cost, cold-start, hypotheses, plots)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared",
    "analysis",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "matplotlib>=3.10.8",
    "structlog",
    "httpx>=0.28.0",
]

[project.scripts]
thesis-analysis = "analysis_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analysis_cli"]
