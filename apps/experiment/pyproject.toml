[project]
name = "experiment"
version = "0.1.0"
description = "Experiment orchestration with composable pipeline stages"
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared",
    "clients",
    "scipy>=1.16.1",
    "numpy",
    "rich>=13.0.0",
    "typer>=0.15.0",
    "requests>=2.32.4",
    "structlog",
]

[project.scripts]
thesis-experiment = "experiment.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["experiment"]
