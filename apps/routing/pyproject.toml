[project]
name = "routing"
version = "0.1.0"
description = "Routing daemon, Algorithm 1, SLO monitor, scaling"
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared",
    "clients",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "requests>=2.32.4",
    "prometheus-client>=0.21.0",
    "structlog",
]

[project.scripts]
thesis-routing-daemon = "routing.daemon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["routing"]
