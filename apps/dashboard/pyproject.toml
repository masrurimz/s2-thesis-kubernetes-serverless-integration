[project]
name = "dashboard"
version = "0.1.0"
description = "Interactive Streamlit dashboard for archived thesis experiment results"
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared",
    "streamlit>=1.40",
    "plotly>=5.24",
    "pandas>=2.3.1",
    "numpy",
    "structlog",
]

[project.scripts]
thesis-dashboard = "dashboard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dashboard"]
