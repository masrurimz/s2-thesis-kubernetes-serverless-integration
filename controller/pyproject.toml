[project]
name = "thesis-controller"
version = "0.1.0"
description = "Intelligent routing controller for hybrid K8s-Serverless system"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
gru-prediction-server = "prediction.prediction_server:main"
routing-controller = "intelligent_router.routing_controller:main"
weight-adjuster = "intelligent_router.weight_adjuster:main"
routing-daemon = "daemon.routing_daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["intelligent_router", "prediction", "autoscaler", "monitoring_v2", "daemon", "scaling"]
