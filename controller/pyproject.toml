[project]
name = "thesis-hybrid-controller"
version = "0.1.0"
description = "Intelligent routing controller for hybrid K8s-Serverless system with workload prediction"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.12.15",
    "fastapi>=0.116.1",
    "joblib",
    "pandas>=2.3.1",
    "pydantic>=2.11.7",
    "requests>=2.32.4",
    "scikit-learn>=1.7.1",
    "scipy>=1.16.1",
    "structlog",
    "pyyaml",
    "uvicorn>=0.35.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]

[project.scripts]
prediction-server = "prediction_engine.prediction_server:main"
routing-controller = "intelligent_router.routing_controller:main"
data-collector = "prediction_engine.data_collector:main"
weight-adjuster = "intelligent_router.weight_adjuster:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prediction_engine", "intelligent_router"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
