version: "3.8"
services:
  haproxy:
    image: haproxy:2.4-alpine
    container_name: sprint1-haproxy
    ports:
      - "18082:8082"  # Main traffic endpoint (avoid k3d port conflict)
      - "18404:8404"  # Stats interface
      - "19999:9999"  # HAProxy admin socket (TCP)
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro,z
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - k3d-thesis-hybrid

networks:
  k3d-thesis-hybrid:
    external: true
