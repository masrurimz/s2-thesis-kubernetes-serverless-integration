version: "3.8"
services:
  haproxy:
    image: haproxy:2.4-alpine
    container_name: sprint1-haproxy
    ports:
      - "8082:8082"  # Main traffic endpoint
      - "8404:8404"  # Stats interface
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - haproxy-socket:/var/run
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hybrid-network

volumes:
  haproxy-socket:

networks:
  hybrid-network:
    driver: bridge