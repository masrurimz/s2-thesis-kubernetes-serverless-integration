version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: sprint1-prometheus
    restart: unless-stopped
    
    # Resource constraints for 8GB system
    mem_limit: 1024m
    mem_reservation: 512m
    cpus: '0.5'
    
    # Networking
    ports:
      - "9090:9090"
    
    # Configuration
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    
    # Command line options for resource constraints
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=1h'
      - '--storage.tsdb.retention.size=512MB'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--log.level=info'
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # Labels for identification
    labels:
      - "sprint1.component=monitoring"
      - "sprint1.service=prometheus"

  # Optional: Basic Grafana for visualization (commented out for resource constraints)
  # grafana:
  #   image: grafana/grafana:10.1.0
  #   container_name: sprint1-grafana
  #   restart: unless-stopped
  #   mem_limit: 256m
  #   cpus: '0.25'
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=admin
  #     - GF_USERS_ALLOW_SIGN_UP=false
  #   volumes:
  #     - grafana-data:/var/lib/grafana
  #   depends_on:
  #     - prometheus

volumes:
  prometheus-data:
    driver: local
  # grafana-data:
  #   driver: local

networks:
  default:
    name: sprint1-monitoring
    driver: bridge