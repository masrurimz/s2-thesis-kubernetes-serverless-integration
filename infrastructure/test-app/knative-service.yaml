apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: test-app
  labels:
    app: test-app
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "10"
        autoscaling.knative.dev/target: "10"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containerConcurrency: 10
      containers:
        - image: k3d-registry.localhost:5000/test-app:latest
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_NAME
              value: "Knative Serverless"
            - name: GOMAXPROCS
              value: "1"
            - name: WORK_DURATION_MS
              value: "10"
            - name: FIB_N
              value: "32"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 3
