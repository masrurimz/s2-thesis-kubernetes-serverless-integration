apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app-cold
  labels:
    app: test-app-cold
spec:
  replicas: 0
  selector:
    matchLabels:
      app: test-app-cold
  template:
    metadata:
      labels:
        app: test-app-cold
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: cold-start-delay
          image: busybox:1.36
          command: ['sh', '-c', 'echo "Simulating cold start..." && sleep 5']
      containers:
        - name: test-app-cold
          image: k3d-registry.localhost:5000/test-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: BACKEND_NAME
              value: "Serverless-Cold"
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: test-app-cold
  labels:
    app: test-app-cold
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: test-app-cold
