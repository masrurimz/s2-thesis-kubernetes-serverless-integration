# HAProxy configuration for cold-start simulation experiment
# Routes to:
#   - test-app-warm (K8s, NodePort 30080) - always available ~10ms
#   - serverless-activator (NodePort 30081) - triggers cold-start on scale-from-zero

global
    daemon
    stats socket /tmp/haproxy.sock mode 666 level admin
    stats socket ipv4@:9999 level admin
    log stdout local0

defaults
    mode http
    timeout connect 30000ms  # Increased for cold-start scenarios
    timeout client 60000ms
    timeout server 60000ms   # Allow time for cold-start (up to 30s)
    option httplog
    log global

frontend hybrid_frontend
    bind *:8082
    default_backend servers

backend servers
    balance roundrobin
    option httpchk GET /health
    
    # K8s warm backend - 80% weight, always available
    # Via k3d loadbalancer which exposes NodePorts
    server k3s-warm 127.0.0.1:30080 weight 80 check inter 5s fall 3 rise 2
    
    # Serverless activator - 20% weight, triggers cold-start
    server serverless 127.0.0.1:30081 weight 20 check inter 5s fall 3 rise 2

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE
