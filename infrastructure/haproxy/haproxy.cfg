global
    daemon
    stats socket /tmp/haproxy.sock mode 666 level admin
    stats socket ipv4@:9999 level admin
    log stdout local0

defaults
    mode http
    timeout connect 30000ms
    timeout client 60000ms
    timeout server 60000ms
    option httplog
    log global

frontend hybrid_frontend
    bind *:8082
    default_backend servers

backend servers
    balance roundrobin
    option httpchk GET /health
    # K8s warm backend - 80% weight
    server k3s-cluster 192.168.156.3:30080 weight 80 check inter 5s fall 3 rise 2
    # Serverless activator backend - 20% weight
    server serverless-sim 192.168.156.3:30081 weight 20 check inter 5s fall 3 rise 2

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE
