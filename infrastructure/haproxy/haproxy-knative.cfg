# HAProxy configuration for real Knative integration
# Default: 100% K8s / 0% Knative (serverless enabled only on SCALE_OUT)

global
    daemon
    stats socket /tmp/haproxy.sock mode 666 level admin
    stats socket ipv4@:9999 level admin
    log stdout local0

defaults
    mode http
    timeout connect 30000ms
    timeout client 60000ms
    timeout server 60000ms
    option httplog
    log global

frontend hybrid_frontend
    bind *:8082
    default_backend servers

backend servers
    balance roundrobin
    option httpchk GET /health
    
    # K8s warm backend - 100% weight (default)
    # Standard health check - always needs to be available
    server k3s-cluster 192.168.156.3:30080 weight 100 check inter 5s fall 3 rise 2
    
    # Knative serverless backend via Kourier gateway - 0% weight (default)
    # NO health check - allows Knative scale-to-zero
    # Host header routing via http-request set-header
    # Starts in MAINT mode - enabled by Algorithm 1 SCALE_OUT
    server knative 192.168.156.2:80 weight 0 disabled

# Backend specifically for Knative requests (sets Host header)
backend knative_backend
    mode http
    balance roundrobin
    # Set Host header for Knative routing
    http-request set-header Host test-app.default.localhost
    # No health check - Knative handles scale-to-zero
    server knative-kourier 192.168.156.2:80

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE
