[project]
name = "thesis-hybrid-k3s-serverless"
version = "0.1.0"
description = "Hybrid k3s-serverless architecture with GRU workload prediction"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Core framework
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.12.0",
    "structlog",
    "python-dotenv>=1.2.1",
    "pyyaml",
    # HTTP / async
    "aiohttp>=3.12.15",
    "requests>=2.32.4",
    "httpx>=0.28.0",
    # Data / ML
    "pandas>=2.3.1",
    "numpy",
    "scikit-learn>=1.7.1",
    "scipy>=1.16.1",
    "joblib",
    "pyarrow>=23.0.0",
    "duckdb>=1.4",
    "torch>=2.9.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision>=0.24.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchaudio>=2.9.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "prometheus-client>=0.21.0",
    # Visualization
    "matplotlib>=3.10.8",
    # CLI
    "typer>=0.15.0",
    "rich>=13.0.0",
    # Dev / test
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    # Workspace members
    "shared",
    "infra",
    "analysis",
    "prediction",
    "routing",
    "experiment",
    "cli",
    "dashboard",
    "analysis-cli",
    "torch",
    "torchvision",
    "torchaudio",
]

[tool.uv.workspace]
members = [
    "libs/shared",
    "libs/infra",
    "libs/analysis",
    "apps/prediction",
    "apps/routing",
    "apps/experiment",
    "apps/dashboard",
    "apps/analysis",
    "apps/cli",
]


# AMD ROCm PyTorch stable index — ROCm 7.2 (latest: torch 2.13.0, gfx1103 native)
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = false

[tool.uv]
index-strategy = "unsafe-best-match"


[tool.uv.sources]
shared = { workspace = true }
infra = { workspace = true }
analysis = { workspace = true }
prediction = { workspace = true }
routing = { workspace = true }
experiment = { workspace = true }
dashboard = { workspace = true }
cli = { workspace = true }
analysis-cli = { workspace = true }
torch = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }
torchaudio = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "ty>=0.0.56",
    "prek>=0.4",
    "import-linter",
    "pytest-timeout",
    "hypothesis",
    "mutmut",
]

[tool.importlinter]
# The layering the code actually has, read off the import graph before it was written
# down: the unified CLI composes apps; apps may use the prediction service, the
# libraries and shared; libraries use shared; shared uses nothing above it.
root_packages = [
    "cli",
    "experiment",
    "analysis_cli",
    "dashboard",
    "routing",
    "prediction",
    "infra",
    "analysis",
    "shared",
]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Entry point over apps over libraries over shared"
type = "layers"
layers = [
    "cli",
    "experiment | analysis_cli | dashboard | routing",
    "prediction",
    "infra | analysis",
    "shared",
]

[[tool.importlinter.contracts]]
name = "One loader for run artifacts"
type = "protected"
protected_modules = ["shared.artifacts"]
allowed_importers = ["experiment", "analysis", "analysis_cli"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["archived", ".venv", "results"]

[tool.ruff.lint]
# E402: module-import-not-at-top (needed for sys.path.insert patterns)
# F841: unused-variable (matplotlib bar assignments, debug vars in analysis scripts)
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"apps/routing/tests/*.py" = ["F841"]
"apps/prediction/tests/*.py" = ["F841"]
"apps/analysis/analysis_cli/*.py" = ["F841"]

[tool.ruff.format]
quote-style = "double"


[tool.ty.src]
# The archived/ snapshot is a frozen pre-refactor copy of the codebase: its diagnostics
# are history, not work, and they are the only reason the type check used to be a
# manual-stage hook. Excluding it lets ty gate commits on code that is actually live.
exclude = ["archived/**"]

[tool.pytest.ini_options]
# Modern layout per the pytest docs: several packages carry their own tests/
# directory, and the default prepend import mode lets the first one imported claim
# the name "tests". importlib derives a unique name from the path instead, with the
# one trade-off that test modules must not import each other (they don't).
addopts = "--import-mode=importlib --strict-markers -m 'not live'"
testpaths = ["apps", "libs"]
markers = [
    "live: touches the real k3d clusters and Docker; run explicitly with -m live, never while an experiment is running",
]
# A hung test fails instead of stalling a measurement window. The live tier opts out
# per module; those runs are minutes long by nature.
timeout = 120
norecursedirs = ["archived", ".*", "build", "dist", "node_modules", "venv", "{arch}"]
timeout_method = "signal"

[tool.mutmut]
# Scope, not a repo-wide gate: these are the modules where a mutation would restore a
# bug this refactor removed. Run with `uv run mutmut run`.
paths_to_mutate = [
    "libs/shared/shared/artifacts.py",
    "apps/experiment/experiment/tuning/workload_analysis.py",
    "apps/routing/routing/algorithm/registry.py",
]
tests_dir = "libs/shared/tests"
