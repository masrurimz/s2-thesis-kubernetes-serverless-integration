[project]
name = "thesis-hybrid-k3s-serverless"
version = "0.1.0"
description = "Hybrid k3s-serverless architecture with GRU workload prediction"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Core framework
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.12.0",
    "structlog",
    "python-dotenv>=1.2.1",
    "pyyaml",
    # HTTP / async
    "aiohttp>=3.12.15",
    "requests>=2.32.4",
    "httpx>=0.28.0",
    # Data / ML
    "pandas>=2.3.1",
    "numpy",
    "scikit-learn>=1.7.1",
    "scipy>=1.16.1",
    "joblib",
    "pyarrow>=23.0.0",
    "torch>=2.9.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision>=0.24.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchaudio>=2.9.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "prometheus-client>=0.21.0",
    # Visualization
    "matplotlib>=3.10.8",
    # CLI
    "typer>=0.15.0",
    "rich>=13.0.0",
    # Dev / test
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    # Workspace members
    "shared",
    "infra",
    "analysis",
    "prediction",
    "routing",
    "experiment",
    "cli",
    "dashboard",
    "analysis-cli",
    "torch",
    "torchvision",
    "torchaudio",
]

[tool.uv.workspace]
members = [
    "libs/shared",
    "libs/infra",
    "libs/analysis",
    "apps/prediction",
    "apps/routing",
    "apps/experiment",
    "apps/dashboard",
    "apps/analysis",
    "apps/cli",
]


# AMD ROCm PyTorch stable index — ROCm 7.2 (latest: torch 2.13.0, gfx1103 native)
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = false

[tool.uv]
index-strategy = "unsafe-best-match"


[tool.uv.sources]
shared = { workspace = true }
infra = { workspace = true }
analysis = { workspace = true }
prediction = { workspace = true }
routing = { workspace = true }
experiment = { workspace = true }
dashboard = { workspace = true }
cli = { workspace = true }
analysis-cli = { workspace = true }
torch = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }
torchaudio = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "ty>=0.0.56",
    "prek>=0.4",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["archived", ".venv", "results"]

[tool.ruff.lint]
# E402: module-import-not-at-top (needed for sys.path.insert patterns)
# F841: unused-variable (matplotlib bar assignments, debug vars in analysis scripts)
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"apps/routing/tests/*.py" = ["F841"]
"apps/prediction/tests/*.py" = ["F841"]
"apps/analysis/analysis_cli/*.py" = ["F841"]

[tool.ruff.format]
quote-style = "double"


[tool.ty]
# exclude is not a valid top-level field for ty; paths are filtered via CLI args
