    - "At D=10ms: α=0.02 (1/50), target_replicas=2 at mean (73 RPS), 4 at peak (164 RPS)"
    - "85% of ClarkNet stages require >1 replica — scaling is exercised throughout experiment"
    - "Previous calibration (D=5ms, α=0.0069) was wrong: target_replicas=1 for loads <121 RPS"
  decision: "Use D=10ms (duration_ms=10) for Phase B redesign"
reproduce:
  - "k6 run -e TARGET_URL=http://localhost:18082 -e WORK_MS=10 -e TARGET_RPS=RPS -e DURATION=30s infrastructure/load-tests/calibrate_work.js"
