status: invalidated
invalidated_on: 2026-02-14
invalidation_bugs:
  - id: bug-4
    description: "HAProxy server name mismatch: ScenarioResetter uses 'k3s-cluster' but actual server is 'k3s'. Weight resets silently failed via HAProxy Runtime API."
    impact: "S1 never got 100/0 weights, S2 never got 0/100. All scenarios started with stale weights from previous run."
    fix_bead: s2-1xu
  - id: bug-5
    description: "Stale daemon process on port 9104 not killed between runs. New daemon fails to bind, Prometheus scrapes old daemon."
    impact: "All scenarios show PREDICTIVE actions from stale daemon. Complete metric contamination across scenarios."
    fix_bead: s2-jrc
  - id: bug-6
    description: "Prometheus counter query uses 'routing_daemon_prediction_used' but Prometheus stores as 'routing_daemon_prediction_used_total'. Query returns empty."
    impact: "gru_predictions_used=0 for ALL scenarios including S4 where GRU was healthy."
    fix_bead: s2-nxq
  - id: bug-7
    description: "No pre-run invariant checks existed to catch any of these bugs."
    impact: "All bugs went undetected for 20 runs (~2 hours of experiment time)."
    fix_bead: s2-9w2
