  supports: [H1, H2]
  notes:
    - "ALL 20 runs invalidated due to 4 experiment design bugs"
    - "k6 latency data is valid (correct endpoint, ~87K requests/run, ~73 RPS mean)"
    - "ALL daemon metrics (routing decisions, weight shifts, GRU usage) are garbage"
    - "S1 shows PREDICTIVE=165-786 and time_in_serverless=70-96% — impossible for K8s-only"
