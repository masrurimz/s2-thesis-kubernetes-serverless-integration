[project]
name = "sprint2-intelligent-routing"
version = "0.1.0"
description = "Sprint 2: Intelligent routing with load prediction for hybrid k3s-serverless system"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.12.15",
    "fastapi>=0.116.1",
    "joblib",
    "pandas>=2.3.1",
    "pydantic>=2.11.7",
    "requests>=2.32.4",
    "scikit-learn>=1.7.1",
    "scipy>=1.16.1",
    "structlog",
    "uvicorn>=0.35.0",
]

[project.scripts]
prediction-server = "prediction_engine.prediction_server:main"
intelligent-router = "intelligent_router.routing_controller:main"
data-collector = "prediction_engine.data_collector:main"
weight-adjuster = "intelligent_router.weight_adjuster:main"
decision-logger = "intelligent_router.decision_logger:main"
fallback-handler = "intelligent_router.fallback_handler:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prediction_engine", "intelligent_router"]
