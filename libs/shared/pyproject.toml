[project]
name = "shared"
version = "0.1.0"
description = "Shared models, config, protocols, and storage contracts for the thesis hybrid system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11.7",
    "pydantic-settings>=2.12.0",
    "structlog",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
