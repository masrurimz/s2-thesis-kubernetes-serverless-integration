[project]
name = "infra"
version = "0.1.0"
description = "Infrastructure adapters: Prometheus, HAProxy, Kubernetes, k6"
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared",
    "requests>=2.32.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infra"]
