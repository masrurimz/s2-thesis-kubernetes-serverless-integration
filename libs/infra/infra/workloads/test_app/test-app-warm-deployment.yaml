apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app-warm
  labels:
    app: test-app-warm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app-warm
  template:
    metadata:
      labels:
        app: test-app-warm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        node-type: workload
      containers:
        - name: test-app-warm
          image: k3d-registry.localhost:5000/test-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: BACKEND_NAME
              value: "K8s-Warm"
            - name: PORT
              value: "8080"
            - name: GOMAXPROCS
              value: "1"
            # I/O wait simulation (SeBS: arXiv:2012.14132). Real serverless workloads
            # spend 50-200ms on I/O (DB queries, API calls, storage). This simulates
            # that I/O component. Lambda bills for wall-clock duration including waits.
            - name: WORK_DURATION_MS
              value: "50"
            - name: FIB_N
              value: "30"
          resources:
            requests:
              cpu: 300m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: test-app-warm
  labels:
    app: test-app-warm
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: test-app-warm
