# HAProxy configuration for real Knative integration
# Default: 100% K8s / 0% Knative (serverless enabled only on SCALE_OUT)

global
    daemon
    stats socket /tmp/haproxy.sock mode 666 level admin
    stats socket ipv4@:9999 level admin
    log stdout local0

defaults
    mode http
    timeout connect 30000ms
    timeout client 60000ms
    timeout server 60000ms
    option httplog
    log global

frontend hybrid_frontend
    bind *:8082
    default_backend servers

backend servers
    balance roundrobin
    option httpchk GET /health
    
    # Set Host header for Knative routing (K8s ignores it, Knative needs it)
    # This applies to all requests but only matters for Knative backend
    http-request set-header X-Original-Host %[req.hdr(Host)]
    http-request set-header Host test-app.default.localhost
    
    # K8s warm backend - 100% weight (default)
    server k3s-cluster k3d-thesis-hybrid-agent-0:30080 weight 100 check inter 5s fall 3 rise 2
    
    # Knative serverless via Kourier - 0% weight (default, disabled)
    # NO health check - allows Knative scale-to-zero
    server knative host.docker.internal:8083 weight 0 disabled

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE
