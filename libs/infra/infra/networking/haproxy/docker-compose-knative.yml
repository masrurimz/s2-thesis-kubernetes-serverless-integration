version: "3.8"
services:
  haproxy:
    image: haproxy:2.4-alpine
    container_name: sprint1-haproxy
    ports:
      - "18082:8082"
      - "18404:8404"
      - "19999:9999"
    volumes:
      - ${HAPROXY_CFG:-./haproxy-knative.cfg}:/usr/local/etc/haproxy/haproxy.cfg:ro,z
      - /tmp:/tmp
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - k3d-thesis-hybrid

networks:
  k3d-thesis-hybrid:
    external: true
