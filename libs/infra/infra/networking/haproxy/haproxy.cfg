global
    stats socket ipv4@:9999 level admin
    log stdout local0

defaults
    mode http
    timeout connect 30000ms
    timeout client 60000ms
    timeout server 60000ms
    option httplog
    log global

frontend hybrid_frontend
    bind *:8082
    default_backend servers

backend servers
    balance roundrobin
    option httpchk GET /health
    # Rewrite Host header for Kourier/Knative routing
    # K8s backend ignores Host, Knative requires it
    http-request set-header Host test-app.default.127.0.0.1.sslip.io
    # K8s warm backend - 100% weight (start K8s-first)
    server k3s k3d-thesis-hybrid-agent-0:30080 weight 100 check inter 5s fall 3 rise 2
    # Knative backend via Kourier NodePort - 0% weight (enabled dynamically)
    server knative host.docker.internal:8083 weight 0

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE
