[project]
name = "analysis"
version = "0.1.0"
description = "Domain analysis library — data loaders, statistical comparison, cold-start decomposition, cost model, report generation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared",
    "numpy",
    "scipy",
    "structlog",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analysis"]
